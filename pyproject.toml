[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "physisserve"
version = "0.1.0"
description = "Stage-wise pipelining for autoregressive video diffusion"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "diffusers>=0.40",
    "transformers>=5.14",
    "huggingface-hub>=0.34",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "ftfy>=6.1",
    "numpy>=1.24",
    "imageio[ffmpeg]>=2.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["physisserve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
